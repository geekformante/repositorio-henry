<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbar Video v2</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
  #stage > *{position:absolute;left:0;top:0}
  svg{display:block}
  text{font-family:Inter, "Inter Display", system-ui, sans-serif}
  #glass{display:none;box-sizing:border-box;border-radius:32px;
    background:rgba(24,25,29,.66);
    -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
    border:1.5px solid rgba(255,255,255,.10);
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08)}
</style>
</head>
<body>
<div id="stage">
  <svg id="world" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" patternUnits="userSpaceOnUse" width="40" height="40">
        <circle id="dot" cx="20" cy="20" r="2.4" fill="#2E3037"/>
      </pattern>
      <filter id="canvasShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
      </filter>
      <!-- relleno de "subpíxeles" para el bote de pintura -->
      <pattern id="subpix" patternUnits="userSpaceOnUse" width="27" height="27">
        <rect width="27" height="27" fill="#14161C"/>
        <rect x="2" y="3" width="6.5" height="21" rx="2" fill="#FF4D4D"/>
        <rect x="10.25" y="3" width="6.5" height="21" rx="2" fill="#2BD17E"/>
        <rect x="18.5" y="3" width="6.5" height="21" rx="2" fill="#3B82F6"/>
      </pattern>
    </defs>
    <rect id="bg" fill="#141518"/>
    <rect id="dotLayer" fill="url(#dots)"/>
    <g id="cam"></g>
  </svg>
  <div id="glass"></div>
  <svg id="ui" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="tbShadow" x="-40%" y="-10%" width="180%" height="120%">
        <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
      </filter>
      <linearGradient id="icoGrad" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#2A2B30"/></linearGradient>
      <filter id="tipShadow" x="-20%" y="-40%" width="140%" height="180%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
      </filter>
    </defs>
    <g id="top"></g>
    <g id="toolbar"></g>
    <g id="overlay"></g>
    <text id="measure" x="-9999" y="-9999"></text>
  </svg>
</div>

<script>
/* =====================================================================
   PARÁMETROS
   ?h=2340 (por defecto, pantalla completa iPhone 9:19.5) · ?h=1920 (9:16)
   ?solid  → barra opaca (por defecto es translúcida con desenfoque)
   ===================================================================== */
const P = new URLSearchParams(location.search);
const W = 1080, H = +(P.get('h') || 2340), GLASS = !P.has('solid');   // translúcida por defecto; ?solid para la opaca

const TOP = { bottom:0 };   // sin interfaz superior
const ACCENT = '#0D99FF';
const INK = '#1F2430';

/* Barra de una sola hilera con herramientas de Illustrator (orden real, arriba → abajo).
   Los id 'marquee' y 'bucket' se conservan para el guion: son Selección y Bote de pintura interactiva. */
const TOOLS = [
  { id:'marquee', name:'Selección',          key:'V' },
  { id:'direct',  name:'Selección directa',  key:'A' },
  { id:'wand',    name:'Varita mágica',      key:'Y' },
  { id:'lasso',   name:'Lazo',               key:'Q' },
  { id:'pen',     name:'Pluma',              key:'P' },
  { id:'type',    name:'Texto',              key:'T' },
  { id:'line',    name:'Segmento de línea',  key:'\\' },
  { id:'rect',    name:'Rectángulo',         key:'M' },
  { id:'ellipse', name:'Elipse',             key:'L' },
  { id:'brush',   name:'Pincel',             key:'B' },
  { id:'pencil',  name:'Lápiz',              key:'N' },
  { id:'eraser',  name:'Borrador',           key:'⇧E' },
  { id:'rotate',  name:'Rotar',              key:'R' },
  { id:'scale',   name:'Escala',             key:'S' },
  { id:'builder', name:'Generador de formas',key:'⇧M' },
  { id:'bucket',  name:'Bote de pintura interactiva', key:'K' },
  { id:'gradient',name:'Degradado',          key:'G' },
  { id:'eyedrop', name:'Cuentagotas',        key:'I' },
  { id:'graph',   name:'Gráfica de columnas',key:'J' },
  { id:'artboard',name:'Mesa de trabajo',    key:'⇧O' },
  { id:'hand',    name:'Mano',               key:'H' },
  { id:'zoom',    name:'Zoom',               key:'Z' },
];
const toolIndex = Object.fromEntries(TOOLS.map((t,i)=>[t.id,i]));

/* Barra flotante: de arriba a abajo del video, con el mismo aire que a la izquierda */
const TB = { x:28, pad:14, gap:6, r:32, head:40, foot:300 };
TB.y = TB.x; TB.h = H - 2*TB.x;
TB.btn = Math.floor((TB.h - 2*TB.pad - TB.head - TB.foot - (TOOLS.length-1)*TB.gap) / TOOLS.length);
TB.w = TB.btn + 2*TB.pad;
TB.btnsH = TOOLS.length*TB.btn + (TOOLS.length-1)*TB.gap;
TB.btnY0 = TB.y + TB.pad + TB.head;
function btnRect(id){
  const i = toolIndex[id], x = TB.x + TB.pad, y = TB.btnY0 + i*(TB.btn+TB.gap);
  return { x, y, w:TB.btn, h:TB.btn, cx:x+TB.btn/2, cy:y+TB.btn/2 };
}

const ICONS = {
  marquee:`<path d="M6.5 3v16.5l4.3-4.2 2.9 6.4 2.6-1.2-2.9-6.2h6z" fill="currentColor"/>`,
  direct: `<path d="M6.5 3v16.5l4.3-4.2 2.9 6.4 2.6-1.2-2.9-6.2h6z"/>`,
  wand:   `<path d="M4 20 14.5 9.5" stroke-width="2.2"/><path d="M17.5 2.5v3M17.5 9.5v3M12.5 7.5h3M19.5 7.5h3M14.6 4.6l1.4 1.4M19 9l1.4 1.4M20.4 4.6 19 6"/>`,
  lasso:  `<ellipse cx="13" cy="8.5" rx="8" ry="5"/><path d="M7.5 12.2c-1.6 1.1-1.8 3 .2 3.6 1.6.5 1.3 2.6-.9 3.9"/>`,
  pen:    `<path d="M12 2.5 18 10l-3 8.5H9L6 10z"/><path d="M12 2.5v8"/><circle cx="12" cy="12.6" r="1.5"/><path d="M9 21.5h6"/>`,
  type:   `<path d="M5 5.5h14M12 5.5v13.5M9.2 19h5.6" stroke-width="2.1"/>`,
  line:   `<path d="M5 19 19 5" stroke-width="1.9"/>`,
  rect:   `<rect x="4" y="5" width="16" height="14" rx="1.5"/>`,
  ellipse:`<ellipse cx="12" cy="12" rx="8.5" ry="6.5" fill="currentColor" fill-opacity=".25"/>`,
  brush:  `<path d="M20 3.2c-3.4 1-7.4 5-9.4 8.2l2.9 2.9c3.2-2 7.2-6 8.2-9.4.3-1.1-.6-2-1.7-1.7z"/><path d="M9.6 12.6c-2.2 0-3.8 1.5-3.8 3.6 0 1.6-1 2.6-2.6 3.1 3.4 1.2 7.5.1 8.3-3.3z" fill="currentColor"/>`,
  pencil: `<path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4M5.2 15.4l3.4 3.4"/>`,
  eraser: `<path d="M8.6 20 3.9 15.3a1.6 1.6 0 0 1 0-2.2l9.2-9.2a1.6 1.6 0 0 1 2.2 0l4.8 4.8a1.6 1.6 0 0 1 0 2.2L11 20z"/><path d="M8.2 8.8l7 7M11 20h9.5"/>`,
  rotate: `<path d="M18.5 12a6.5 6.5 0 1 1-1.9-4.6" stroke-dasharray="2 2.2"/><path d="M17.5 3.5v4.4h-4.4"/>`,
  scale:  `<rect x="3.5" y="10.5" width="10" height="10" rx="1"/><rect x="9" y="4" width="11" height="11" rx="1" stroke-dasharray="2.2 1.8"/><path d="M13 11l4-4M14 7h3v3"/>`,
  builder:`<circle cx="9" cy="10" r="5.5"/><rect x="10" y="9" width="9.5" height="9.5" rx="1"/><path d="M10 10a5.5 5.5 0 0 1 4.5 4.5" fill="currentColor" fill-opacity=".5"/>`,
  bucket: `<path d="M3.8 11.2 11 4l8 8-7.2 7.2a1.5 1.5 0 0 1-2.1 0l-5.9-5.9a1.5 1.5 0 0 1 0-2.1z"/><path d="M8.5 6.5 5.5 3.5M3.8 11.2H19"/><path d="M20.3 14.6s-1.9 2.3-1.9 3.6a1.9 1.9 0 0 0 3.8 0c0-1.3-1.9-3.6-1.9-3.6z" fill="currentColor" stroke="none"/>`,
  gradient:`<rect x="4" y="5" width="16" height="14" rx="1.5" fill="url(#icoGrad)"/>`,
  eyedrop:`<path d="M16.6 3.4a2.2 2.2 0 0 1 3.1 3.1L17.3 9l1.1 1.1-1.6 1.6-5.5-5.5 1.6-1.6L14 5.7z"/><path d="M12.6 7.9 5 15.5V19h3.5l7.6-7.6"/>`,
  graph:  `<path d="M3.5 20.5h17M6.5 20V12M10.5 20V5.5M14.5 20V9M18.5 20v-6" stroke-width="2.2"/>`,
  artboard:`<rect x="7.5" y="7.5" width="12" height="12" rx="1"/><path d="M7.5 2.5v3M2.5 7.5h3M19.5 21.5v-0M4 4l2 2"/>`,
  hand:   `<path d="M8 12.5V5.6a1.5 1.5 0 0 1 3 0V11M11 10.5V4.1a1.5 1.5 0 0 1 3 0V11M14 10.8V5.6a1.5 1.5 0 0 1 3 0V12M17 8.6a1.5 1.5 0 0 1 3 0V15a6.2 6.2 0 0 1-6.2 6.2h-1.4a6.2 6.2 0 0 1-4.8-2.3L4.2 15a1.6 1.6 0 0 1 2.4-2.1L8 14.3"/>`,
  zoom:   `<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20.5 20.5" stroke-width="2.4"/>`,
};
function iconSVG(id, x, y, size, color){
  return `<g transform="translate(${x},${y}) scale(${size/24})" fill="none" stroke="${color}" color="${color}"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</g>`;
}

/* =====================================================================
   MUNDO: un lienzo grande con varias ideas; la cámara se mueve con la Mano
   ===================================================================== */
const PIX = { x:330, y:Math.round(TOP.bottom + (H-TOP.bottom)/2 - 470), s:560, r:34 };
const third = PIX.s/3;
const IDEA1_TEXT_Y = PIX.y + PIX.s + 172;
// segunda zona: desplazada en diagonal
const PAN = [-640, -1000];
const PHONE = { w:380, h:780, r:62 };
PHONE.cx = 610 - PAN[0];
PHONE.x = PHONE.cx - PHONE.w/2;
PHONE.y = PIX.y - 30 - PAN[1];
const IDEA2_TEXT_Y = PHONE.y + PHONE.h + 150;
const COLORS = { R:'#FF4D4D', G:'#2BD17E', B:'#3B82F6' };
// el lienzo abraza el contenido con margen; puede tener cualquier proporción
const CANVAS = { x:180, y:PIX.y-170, w:1560, r:44 };
CANVAS.h = IDEA2_TEXT_Y + 150 - CANVAS.y;

const SCRIPT = [
  { do:'wait', dur:0.7 },
  { do:'pick', tool:'rect' },
  { do:'drag', from:[PIX.x,PIX.y], to:[PIX.x+PIX.s,PIX.y+PIX.s], dur:1.0, make:{ type:'shape', fill:INK, r:PIX.r } },
  { do:'wait', dur:0.3 },
  { do:'pick', tool:'marquee' },
  { do:'drag', from:[PIX.x,PIX.y], to:[PIX.x+third,PIX.y+PIX.s], dur:0.7, make:{ type:'marquee' } },
  { do:'pick', tool:'bucket' },
  { do:'click', at:[PIX.x+third/2, PIX.y+PIX.s*0.45], make:{ type:'fill', color:COLORS.R } },
  { do:'key', tool:'marquee' },
  { do:'drag', from:[PIX.x+third,PIX.y], to:[PIX.x+2*third,PIX.y+PIX.s], dur:0.5, make:{ type:'marquee' } },
  { do:'key', tool:'bucket' },
  { do:'click', at:[PIX.x+third*1.5, PIX.y+PIX.s*0.55], make:{ type:'fill', color:COLORS.G } },
  { do:'key', tool:'marquee' },
  { do:'drag', from:[PIX.x+2*third,PIX.y], to:[PIX.x+PIX.s,PIX.y+PIX.s], dur:0.5, make:{ type:'marquee' } },
  { do:'key', tool:'bucket' },
  { do:'click', at:[PIX.x+third*2.5, PIX.y+PIX.s*0.5], make:{ type:'fill', color:COLORS.B } },
  { do:'deselect' },
  { do:'pick', tool:'type' },
  { do:'click', at:[PIX.x+PIX.s/2, IDEA1_TEXT_Y], make:{ type:'text', text:'1 píxel = 3 luces', size:72, align:'center' } },
  { do:'type', dur:1.2 },
  { do:'wait', dur:0.6 },
  /* --- nueva idea: la Mano lleva el lienzo a otra zona --- */
  { do:'pick', tool:'hand' },
  { do:'pan', from:[840, PIX.y+PIX.s+640], by:PAN, dur:1.5 },
  { do:'key', tool:'rect' },
  { do:'drag', from:[PHONE.x,PHONE.y], to:[PHONE.x+PHONE.w,PHONE.y+PHONE.h], dur:0.9, make:{ type:'shape', fill:INK, r:PHONE.r } },
  { do:'key', tool:'bucket' },
  { do:'click', at:[PHONE.cx, PHONE.y+PHONE.h*0.45], make:{ type:'fill', pattern:'subpix', color:'#3B82F6' } },
  { do:'key', tool:'type' },
  { do:'click', at:[PHONE.cx, IDEA2_TEXT_Y], make:{ type:'text', text:'3 millones de píxeles', size:62, align:'center' } },
  { do:'type', dur:1.2 },
  { do:'wait', dur:0.8 },
  /* --- cierre: alejar para ver todo el lienzo y conectar las ideas --- */
  { do:'zoomFit', label:'⇧ 1', dur:1.1 },
  { do:'pick', tool:'brush' },
  { do:'stroke', pts:[[PIX.x+PIX.s+50, PIX.y+PIX.s*0.55],[PIX.x+PIX.s+260, PIX.y+PIX.s*0.85],[PHONE.cx-40, PHONE.y-170]],
    dur:1.1, make:{ type:'stroke', color:INK, width:14, arrow:true } },
  { do:'wait', dur:2.2 },
];

/* =====================================================================
   COMPILADOR: guion → línea de tiempo
   ===================================================================== */
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut = t => 1-Math.pow(1-t,3);
const clamp01 = t => Math.max(0,Math.min(1,t));
const lerp = (a,b,t)=>a+(b-a)*t;

const measureEl = document.getElementById('measure');
const widthCache = {};
function textWidth(str, size, weight=800){
  const k = size+'|'+weight+'|'+str; if (k in widthCache) return widthCache[k];
  measureEl.setAttribute('font-size', size); measureEl.setAttribute('font-weight', weight); measureEl.textContent = str;
  return widthCache[k] = measureEl.getComputedTextLength();
}
function catmull(pts, n){
  const out = [], P = [pts[0], ...pts, pts[pts.length-1]];
  for (let i=1;i<P.length-2;i++){
    for (let j=0;j<n;j++){
      const t=j/n, t2=t*t, t3=t2*t, [p0,p1,p2,p3]=[P[i-1],P[i],P[i+1],P[i+2]];
      out.push([0,1].map(d=>0.5*((2*p1[d])+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)));
    }
  }
  out.push(pts[pts.length-1]); return out;
}

function compile(script){
  const tl = { moves:[], cams:[], tool:[{t:0,id:'marquee'}], hovers:[], clicks:[], keys:[], objects:[],
               fg:[{t:0,c:'#000000'}], press:[], grabs:[] };
  let cur = 0, cam = { x:0, y:0, s:1 };
  let pos = [760, PIX.y + PIX.s + 420];
  const w2s = p => [p[0]*cam.s + cam.x, p[1]*cam.s + cam.y];
  const moveTo = to => {
    const d = Math.hypot(to[0]-pos[0], to[1]-pos[1]); if (d < 1) return 0;
    const dur = Math.min(0.9, Math.max(0.45, 0.32 + d/1800));
    tl.moves.push({ t0:cur, t1:cur+dur, from:pos, to, arc:true });
    pos = to; cur += dur; return dur;
  };
  const endMarquees = t => tl.objects.forEach(o=>{ if(o.type==='marquee' && o.tEnd===Infinity) o.tEnd=t; });
  let lastText = null;

  for (const s of script){
    if (s.do==='wait') cur += s.dur;
    else if (s.do==='pick'){
      const b = btnRect(s.tool);
      moveTo([b.cx+8, b.cy+10]);
      const ta = cur;
      tl.hovers.push({ t0:ta-0.12, t1:ta+0.55, id:s.tool });
      tl.clicks.push({ t:ta+0.28, x:pos[0], y:pos[1] });
      tl.press.push({ t:ta+0.28, id:s.tool });
      tl.tool.push({ t:ta+0.3, id:s.tool });
      cur = ta + 0.5;
    }
    else if (s.do==='key'){
      tl.keys.push({ t:cur, label:TOOLS[toolIndex[s.tool]].key, x:pos[0], y:pos[1] });
      tl.press.push({ t:cur+0.08, id:s.tool });
      tl.tool.push({ t:cur+0.08, id:s.tool });
      cur += 0.45;
    }
    else if (s.do==='deselect'){
      tl.keys.push({ t:cur, label:'Ctrl D', x:pos[0], y:pos[1] });
      endMarquees(cur+0.1); cur += 0.5;
    }
    else if (s.do==='drag'){
      moveTo(w2s(s.from)); cur += 0.08;
      if (s.make.type==='marquee') endMarquees(cur);
      const to = w2s(s.to);
      tl.moves.push({ t0:cur, t1:cur+s.dur, from:pos, to, arc:false });
      tl.objects.push({ ...s.make, x0:s.from[0], y0:s.from[1], x1:s.to[0], y1:s.to[1], t0:cur, t1:cur+s.dur, tEnd:Infinity });
      pos = to; cur += s.dur + 0.15;
    }
    else if (s.do==='click'){
      moveTo(w2s(s.at)); cur += 0.06;
      tl.clicks.push({ t:cur, x:pos[0], y:pos[1] });
      const o = { ...s.make, x:s.at[0], y:s.at[1], t0:cur, t1:cur+0.6, tEnd:Infinity };
      if (o.type==='fill'){
        const m = [...tl.objects].reverse().find(q=>q.type==='marquee' && q.t0<=cur && q.tEnd>cur);
        o.sel = m ? [Math.min(m.x0,m.x1),Math.min(m.y0,m.y1),Math.abs(m.x1-m.x0),Math.abs(m.y1-m.y0)] : null;
        o.shape = [...tl.objects].reverse().find(q=>q.type==='shape' && o.x>=Math.min(q.x0,q.x1) && o.x<=Math.max(q.x0,q.x1) && o.y>=Math.min(q.y0,q.y1) && o.y<=Math.max(q.y0,q.y1));
        tl.fg.push({ t:cur-0.3, c:o.color });
        cur += 0.65;
      } else if (o.type==='text'){
        if (o.align==='center') o.x = o.x - textWidth(o.text, o.size)/2;
        o.typeStart = o.typeEnd = cur + 0.35; lastText = o; cur += 0.35;
      }
      tl.objects.push(o);
    }
    else if (s.do==='type' && lastText){
      lastText.typeStart = cur; lastText.typeEnd = cur + s.dur;
      const away = [pos[0]+70, pos[1]+150];
      tl.moves.push({ t0:cur, t1:cur+0.4, from:pos, to:away, arc:false });
      pos = away; cur += s.dur;
      lastText.commit = cur + 0.35;
    }
    else if (s.do==='pan'){
      moveTo(s.from); cur += 0.12;
      const to = [pos[0]+s.by[0], pos[1]+s.by[1]];
      const c2 = { x:cam.x+s.by[0], y:cam.y+s.by[1], s:cam.s };
      tl.grabs.push({ t0:cur-0.08, t1:cur+s.dur+0.08 });
      tl.moves.push({ t0:cur, t1:cur+s.dur, from:pos, to, arc:false });
      tl.cams.push({ t0:cur, t1:cur+s.dur, from:cam, to:c2 });
      pos = to; cam = c2; cur += s.dur + 0.3;
    }
    else if (s.do==='zoomFit'){
      tl.keys.push({ t:cur, label:s.label, x:pos[0], y:pos[1] });
      const vx = TB.x+TB.w+30, vy = TOP.bottom+50, vw = W-vx-40, vh = H-vy-60;
      const sc = Math.min(vw/CANVAS.w, vh/CANVAS.h);
      const c2 = { s:sc, x: vx + (vw - CANVAS.w*sc)/2 - CANVAS.x*sc, y: vy + (vh - CANVAS.h*sc)/2 - CANVAS.y*sc };
      tl.cams.push({ t0:cur+0.15, t1:cur+0.15+s.dur, from:cam, to:c2 });
      cam = c2; cur += s.dur + 0.35;
    }
    else if (s.do==='stroke'){
      let pts = catmull(s.pts, 22);
      if (s.make.arrow){
        const tip = pts[pts.length-1], prev = pts[pts.length-5];
        const d = [tip[0]-prev[0], tip[1]-prev[1]], L = Math.hypot(...d), u = [d[0]/L, d[1]/L], n = [-u[1], u[0]];
        const w1 = [tip[0]-u[0]*70+n[0]*48, tip[1]-u[1]*70+n[1]*48];
        const w2 = [tip[0]-u[0]*70-n[0]*48, tip[1]-u[1]*70-n[1]*48];
        const seg = (a,b,k)=>Array.from({length:k},(_,i)=>[lerp(a[0],b[0],(i+1)/k), lerp(a[1],b[1],(i+1)/k)]);
        pts = [...pts, ...seg(tip,w1,6), ...seg(w1,tip,6), ...seg(tip,w2,6)];
      }
      moveTo(w2s(pts[0])); cur += 0.08;
      const spts = pts.map(w2s);
      tl.moves.push({ t0:cur, t1:cur+s.dur, path:spts });
      tl.objects.push({ ...s.make, pts, t0:cur, t1:cur+s.dur, tEnd:Infinity });
      pos = spts[spts.length-1]; cur += s.dur + 0.2;
    }
  }
  tl.duration = cur;
  return tl;
}

/* =====================================================================
   RENDER(t)
   ===================================================================== */
const $ = id => document.getElementById(id);
const lastBefore = (arr, t) => { let v = arr[0]; for (const a of arr){ if (a.t<=t) v=a; else break; } return v; };

function camAt(tl, t){
  let c = { x:0, y:0, s:1 };
  for (const k of tl.cams){
    if (t < k.t0) break;
    if (t <= k.t1){
      const e = ease(clamp01((t-k.t0)/(k.t1-k.t0)));
      // zoom con interpolación logarítmica para que se sienta natural
      const s = Math.exp(lerp(Math.log(k.from.s), Math.log(k.to.s), e));
      const f = k.from.s===k.to.s ? e : (s - k.from.s)/(k.to.s - k.from.s);
      return { s, x:lerp(k.from.x,k.to.x,f), y:lerp(k.from.y,k.to.y,f) };
    }
    c = k.to;
  }
  return c;
}
function cursorAt(tl, t){
  let p = null;
  for (const m of tl.moves){
    if (t < m.t0) break;
    if (t <= m.t1){
      const k = clamp01((t-m.t0)/(m.t1-m.t0));
      if (m.path){ const f = k*(m.path.length-1), i = Math.floor(f), r = f-i, a = m.path[i], b = m.path[Math.min(i+1,m.path.length-1)]; return [lerp(a[0],b[0],r), lerp(a[1],b[1],r)]; }
      const e = ease(k);
      let x = lerp(m.from[0], m.to[0], e), y = lerp(m.from[1], m.to[1], e);
      if (m.arc){
        const dx = m.to[0]-m.from[0], dy = m.to[1]-m.from[1], d = Math.hypot(dx,dy);
        const bow = Math.sin(Math.PI*e) * d * 0.08; x += -dy/d*bow; y += dx/d*bow;
      }
      return [x,y];
    }
    p = m.path ? m.path[m.path.length-1] : m.to;
  }
  return p ?? tl.moves[0].from;
}

function buildStatic(){
  for (const id of ['stage','world','ui']){ const e=$(id); e.setAttribute?.('width',W); e.setAttribute?.('height',H); e.style.width=W+'px'; e.style.height=H+'px'; }
  $('bg').setAttribute('width',W); $('bg').setAttribute('height',H);
  $('dotLayer').setAttribute('width',W); $('dotLayer').setAttribute('height',H);
  if (GLASS){ const g=$('glass'); Object.assign(g.style,{display:'block',left:TB.x+'px',top:TB.y+'px',width:TB.w+'px',height:TB.h+'px'}); }
}

function renderToolbar(tl, t){
  const active = lastBefore(tl.tool, t).id;
  const hover = tl.hovers.find(h=>t>=h.t0 && t<=h.t1);
  let g = GLASS ? '' :
    `<rect x="${TB.x}" y="${TB.y}" width="${TB.w}" height="${TB.h}" rx="${TB.r}" fill="#202126" stroke="#30323A" stroke-width="1.5" filter="url(#tbShadow)"/>`;
  for (const tool of TOOLS){
    const b = btnRect(tool.id);
    const on = tool.id===active, hv = hover && hover.id===tool.id && !on;
    const pr = tl.press.find(p=>t>=p.t && t<=p.t+0.16 && p.id===tool.id);
    const sc = pr ? 0.88 : 1;
    const bg = on ? ACCENT : hv ? (GLASS ? 'rgba(255,255,255,.12)' : '#30323A') : 'none';
    g += `<g transform="translate(${b.cx},${b.cy}) scale(${sc}) translate(${-b.cx},${-b.cy})">
      <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${Math.round(TB.btn*0.24)}" fill="${bg}"/>
      ${iconSVG(tool.id, b.cx-TB.btn*0.29, b.cy-TB.btn*0.29, TB.btn*0.58, on ? '#FFFFFF' : '#D3D5DA')}</g>`;
  }
  // cabecera: agarradera de panel
  const cx = TB.x + TB.w/2, line = GLASS ? 'rgba(255,255,255,.16)' : '#34363D';
  g += `<g fill="#7C7F88">${[-2,-1,0,1,2].map(i=>`<rect x="${cx+i*8-1.5}" y="${TB.y+TB.pad+12}" width="3" height="12" rx="1.5"/>`).join('')}</g>`;
  // pie: relleno / trazo al estilo Illustrator, modos de color y "más herramientas"
  const fy = TB.btnY0 + TB.btnsH + 18, fg = lastBefore(tl.fg, t).c;
  g += `<rect x="${TB.x+20}" y="${fy}" width="${TB.w-40}" height="1.5" fill="${line}"/>
    <rect x="${cx-16}" y="${fy+56}" width="58" height="58" rx="10" fill="none" stroke="#0E0F12" stroke-width="16"/>
    <rect x="${cx-16}" y="${fy+56}" width="58" height="58" rx="10" fill="none" stroke="#E6E7EA" stroke-width="10"/>
    <rect x="${cx-42}" y="${fy+26}" width="58" height="58" rx="10" fill="${fg}" stroke="#E6E7EA" stroke-width="3"/>
    <path d="M${cx+20} ${fy+22}h14v14" fill="none" stroke="#9EA1A9" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(${cx-42},${fy+150})">
      <rect width="24" height="24" rx="5" fill="#FFFFFF"/>
      <rect x="30" width="24" height="24" rx="5" fill="url(#icoGrad)" stroke="#9EA1A9" stroke-width="1"/>
      <rect x="60" width="24" height="24" rx="5" fill="#FFFFFF"/><path d="M62 22 82 2" stroke="#E5484D" stroke-width="3"/></g>
    <rect x="${TB.x+20}" y="${fy+196}" width="${TB.w-40}" height="1.5" fill="${line}"/>
    <rect x="${TB.x+TB.pad}" y="${fy+214}" width="${TB.btn}" height="44" rx="12" fill="${GLASS?'rgba(255,255,255,.08)':'#2A2C32'}"/>
    <g fill="#C9CBD1">${[-1,0,1].map(i=>`<circle cx="${cx+i*14}" cy="${fy+236}" r="3.5"/>`).join('')}</g>`;
  $('toolbar').innerHTML = g;
  return { active, hover };
}

function shapeRect(o){
  return [Math.min(o.x0,o.x1), Math.min(o.y0,o.y1), Math.abs(o.x1-o.x0), Math.abs(o.y1-o.y0)];
}
function renderWorld(tl, t, cam){
  // puntos del fondo, anclados al mundo
  const sp = 40*cam.s;
  const pat = $('dots');
  pat.setAttribute('width', sp); pat.setAttribute('height', sp);
  pat.setAttribute('x', cam.x % sp); pat.setAttribute('y', cam.y % sp);
  const dot = $('dot'); dot.setAttribute('cx', sp/2); dot.setAttribute('cy', sp/2); dot.setAttribute('r', Math.max(1.3, 2.4*Math.sqrt(cam.s)));

  let g = `<rect x="${CANVAS.x}" y="${CANVAS.y}" width="${CANVAS.w}" height="${CANVAS.h}" rx="${CANVAS.r}" fill="#FFFFFF" filter="url(#canvasShadow)"/>`;
  const px = 1/cam.s; // 1 px de pantalla en unidades del mundo
  for (const o of tl.objects){
    if (t < o.t0 || t >= o.tEnd || o.type==='marquee') continue;
    const k = clamp01((t-o.t0)/(o.t1-o.t0));
    if (o.type==='shape'){
      const kk = ease(k), x1 = lerp(o.x0,o.x1,kk), y1 = lerp(o.y0,o.y1,kk);
      const x = Math.min(o.x0,x1), y = Math.min(o.y0,y1), w = Math.abs(x1-o.x0), h = Math.abs(y1-o.y0);
      const r = Math.min(o.r, w/2, h/2), outline = 1 - clamp01((t-o.t1)/0.35);
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${o.fill}"/>`;
      if (outline>0) g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="${ACCENT}" stroke-width="${3*px}" opacity="${outline}"/>`;
    }
    else if (o.type==='fill'){
      const id = 'f'+Math.round(o.t0*1000);
      const box = o.sel ?? (o.shape ? shapeRect(o.shape) : [CANVAS.x,CANVAS.y,CANVAS.w,CANVAS.h]);
      const R = Math.hypot(Math.max(o.x-box[0], box[0]+box[2]-o.x), Math.max(o.y-box[1], box[1]+box[3]-o.y)) * easeOut(k);
      const sr = o.shape ? shapeRect(o.shape) : [CANVAS.x,CANVAS.y,CANVAS.w,CANVAS.h];
      g += `<clipPath id="${id}a"><rect x="${sr[0]}" y="${sr[1]}" width="${sr[2]}" height="${sr[3]}" rx="${o.shape?.r ?? CANVAS.r}"/></clipPath>
            <clipPath id="${id}b"><rect x="${box[0]}" y="${box[1]}" width="${box[2]}" height="${box[3]}"/></clipPath>
            <g clip-path="url(#${id}a)"><circle cx="${o.x}" cy="${o.y}" r="${R}" fill="${o.pattern ? `url(#${o.pattern})` : o.color}" clip-path="url(#${id}b)"/></g>`;
    }
    else if (o.type==='text'){
      const n = o.text.length;
      const shown = t < o.typeStart ? 0 : Math.round(n * clamp01((t-o.typeStart)/Math.max(0.001,o.typeEnd-o.typeStart)));
      const str = o.text.slice(0, shown), tw = str ? textWidth(str, o.size) : 0;
      g += `<text x="${o.x}" y="${o.y}" font-size="${o.size}" font-weight="800" fill="${INK}">${str}</text>`;
      if (!(o.commit && t >= o.commit)){
        const blink = (t < o.typeStart || t > o.typeEnd) ? (Math.floor((t-o.t0)*2.4)%2===0) : true;
        if (blink) g += `<rect x="${o.x+tw+4}" y="${o.y-o.size*0.82}" width="3" height="${o.size*0.98}" fill="#111"/>`;
        g += `<rect x="${o.x-2}" y="${o.y+12}" width="${Math.max(tw+10,24)}" height="2.5" fill="${ACCENT}"/>`;
      }
    }
    else if (o.type==='stroke'){
      const n = Math.max(2, Math.round(o.pts.length * k));
      g += `<polyline points="${o.pts.slice(0,n).map(p=>p.join(',')).join(' ')}" fill="none" stroke="${o.color}" stroke-width="${o.width}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }
  for (const o of tl.objects){
    if (o.type!=='marquee' || t < o.t0 || t >= o.tEnd) continue;
    const kk = ease(clamp01((t-o.t0)/(o.t1-o.t0)));
    const x1 = lerp(o.x0,o.x1,kk), y1 = lerp(o.y0,o.y1,kk);
    const x = Math.min(o.x0,x1), y = Math.min(o.y0,y1), w = Math.abs(x1-o.x0), h = Math.abs(y1-o.y0);
    g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#fff" stroke-width="${3*px}"/>
          <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#000" stroke-width="${3*px}" stroke-dasharray="${8*px} ${8*px}" stroke-dashoffset="${-(t*36)%16*px}"/>`;
  }
  $('cam').setAttribute('transform', `translate(${cam.x},${cam.y}) scale(${cam.s})`);
  $('cam').innerHTML = g;
}

function cursorSVG(kind, x, y, s){
  const OUT = (d, sw=7) => `<path d="${d}" fill="none" stroke="#000" stroke-width="${sw}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  switch(kind){
    case 'cross': return `<g transform="translate(${x},${y})">${OUT('M-26 0h18M8 0h18M0 -26v18M0 8v18')}</g>`;
    case 'ibeam': return `<g transform="translate(${x},${y})">${OUT('M-10 -26q10 0 10 6v40q0 6 -10 6M10 -26q-10 0 -10 6v40q0 6 10 6')}</g>`;
    case 'brush': { const r = Math.max(6, 7*s); return `<g transform="translate(${x},${y})">
        <circle r="${r+1.5}" fill="none" stroke="#000" stroke-width="3"/><circle r="${r}" fill="none" stroke="#fff" stroke-width="2"/></g>`; }
    case 'bucket': return `<g transform="translate(${x-9},${y-62}) scale(3)">
        <path d="M3.8 11.2 11 4l8 8-7.2 7.2a1.5 1.5 0 0 1-2.1 0l-5.9-5.9a1.5 1.5 0 0 1 0-2.1z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M8.5 6.5 5.5 3.5" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M3.4 20.2s-1.6-2.1-1.6-3.2a1.6 1.6 0 0 1 3.2 0c0 1.1-1.6 3.2-1.6 3.2z" fill="#fff" stroke="#000" stroke-width="1"/></g>`;
    case 'hand': return `<g transform="translate(${x-34},${y-30}) scale(2.8)">
        <path d="${'M8 12.5V5.6a1.5 1.5 0 0 1 3 0V11M11 10.5V4.1a1.5 1.5 0 0 1 3 0V11M14 10.8V5.6a1.5 1.5 0 0 1 3 0V12M17 8.6a1.5 1.5 0 0 1 3 0V15a6.2 6.2 0 0 1-6.2 6.2h-1.4a6.2 6.2 0 0 1-4.8-2.3L4.2 15a1.6 1.6 0 0 1 2.4-2.1L8 14.3z'}" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></g>`;
    case 'grab': return `<g transform="translate(${x-34},${y-30}) scale(2.8)">
        <path d="M6.5 11.2a1.5 1.5 0 0 1 3 0 1.5 1.5 0 0 1 3 0 1.5 1.5 0 0 1 3 0 1.5 1.5 0 0 1 3 .2V15a6.2 6.2 0 0 1-6.2 6.2h-.6A6.2 6.2 0 0 1 6.5 15z M9.5 11.2v2 M12.5 11.2v2 M15.5 11.2v2"
          fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></g>`;
    default: return `<g transform="translate(${x},${y}) scale(2.1)">
        <path d="M0 0v22l5.2-4.8 3.6 7.8 3.4-1.5-3.6-7.6H16z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></g>`;
  }
}

function renderOverlay(tl, t, active, hover, cam){
  let g = '';
  if (hover){
    const a = clamp01((t-hover.t0)/0.12) * (1-clamp01((t-(hover.t1-0.12))/0.12));
    const b = btnRect(hover.id), tool = TOOLS[toolIndex[hover.id]];
    const tw = textWidth(tool.name, 26, 600) + 100, x = TB.x + TB.w + 16, y = b.cy - 30;
    g += `<g opacity="${a}" filter="url(#tipShadow)">
      <rect x="${x}" y="${y}" width="${tw}" height="60" rx="14" fill="#2A2B31" stroke="#3E4048"/>
      <text x="${x+20}" y="${y+39}" font-size="26" font-weight="600" fill="#F2F2F2">${tool.name}</text>
      <rect x="${x+tw-58}" y="${y+12}" width="40" height="36" rx="9" fill="#1B1C20" stroke="#55575F"/>
      <text x="${x+tw-38}" y="${y+38}" font-size="22" font-weight="700" fill="#E6E6E6" text-anchor="middle">${tool.key}</text></g>`;
  }
  for (const c of tl.clicks){
    const k = (t-c.t)/0.45; if (k<0||k>1) continue;
    g += `<circle cx="${c.x}" cy="${c.y}" r="${10+46*easeOut(k)}" fill="none" stroke="${ACCENT}" stroke-width="${5*(1-k)+1}" opacity="${1-k}"/>`;
  }
  for (const kk of tl.keys){
    const k = (t-kk.t)/0.75; if (k<0||k>1) continue;
    const pop = k<0.2 ? easeOut(k/0.2) : 1, a = k>0.75 ? 1-(k-0.75)/0.25 : 1;
    const w = Math.max(76, textWidth(kk.label, 34, 800) + 44), x = kk.x+34, y = kk.y+40;
    g += `<g opacity="${a}" transform="translate(${x+w/2},${y+38}) scale(${0.6+0.4*pop}) translate(${-(x+w/2)},${-(y+38)})">
      <rect x="${x}" y="${y+6}" width="${w}" height="76" rx="16" fill="#0E0E0E"/>
      <rect x="${x}" y="${y}" width="${w}" height="72" rx="16" fill="#F4F4F4" stroke="#0E0E0E" stroke-width="3"/>
      <text x="${x+w/2}" y="${y+48}" font-size="34" font-weight="800" fill="#141414" text-anchor="middle">${kk.label}</text></g>`;
  }
  const [x,y] = cursorAt(tl, t);
  const overUI = y < TOP.bottom || (x > TB.x && x < TB.x+TB.w && y > TB.y && y < TB.y+TB.h);
  const grabbing = tl.grabs.some(gr=>t>=gr.t0 && t<=gr.t1);
  const kind = overUI ? 'arrow' : active==='hand' ? (grabbing ? 'grab' : 'hand')
             : ({rect:'cross', ellipse:'cross', type:'ibeam', bucket:'bucket', brush:'brush'}[active] ?? 'arrow');
  g += cursorSVG(kind, x, y, cam.s);
  $('overlay').innerHTML = g;
}

let TL;
window.renderAt = function(t){
  const cam = camAt(TL, t);
  const { active, hover } = renderToolbar(TL, t);
  renderWorld(TL, t, cam);
  renderOverlay(TL, t, active, hover, cam);
};

(async () => {
  await document.fonts.ready;
  buildStatic();
  TL = compile(SCRIPT); window.TL = TL;
  if (!P.has('render')){
    const stage = $('stage');
    const fit = () => { const s = Math.min(innerWidth/W, innerHeight/H); stage.style.transform = `scale(${s})`; stage.style.left = (innerWidth-W*s)/2+'px'; };
    addEventListener('resize', fit); fit();
    const t0 = performance.now();
    const loop = () => { renderAt(((performance.now()-t0)/1000) % (TL.duration+0.5)); requestAnimationFrame(loop); };
    loop();
  } else renderAt(0);
  window.READY = true;
})();
</script>
